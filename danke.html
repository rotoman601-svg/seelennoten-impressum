<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Danke – Seelennoten</title>
  <style>
    :root { --bg: #0a0503; --gold-hell: #f0cd8e; --gold: #e3b160; --creme: #e8d8b8; --text: #efe6d6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px; line-height: 1.65; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 40px 20px;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, rgba(227, 177, 96, 0.14), transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(122, 31, 43, 0.25), transparent 70%),
        var(--bg);
    }
    main { max-width: 520px; text-align: center; }
    img { width: 140px; height: 140px; border-radius: 50%; display: block; margin: 0 auto 22px; }
    h1 { font-family: "Playfair Display", Georgia, "Times New Roman", serif; color: var(--gold-hell); font-size: 36px; margin: 0 0 10px; }
    p { margin: 0 0 18px; color: var(--creme); }
    a { color: var(--gold-hell); }
  </style>
</head>
<body>
  <main>
    <img src="seelennoten-logo.jpg" alt="Seelennoten-Logo: goldenes Herz mit Herzschlaglinie und Note">
    <h1>Danke für deine Nachricht!</h1>
    <p>Sie ist gut bei uns angekommen. Wir melden uns so schnell wie möglich bei dir.</p>
    <p><a href="./">Zurück zum Impressum</a></p>
  </main>
</body>
</html>
